{% extends "base.html" %}
{% block body %}
<section class="hero">
  <h1>Shows you'd regret missing</h1>
  <p class="sub">Every Austin venue, read against your own concert history.</p>
  <button id="refresh" class="ghost">Re-run</button>
</section>

<div id="status" class="status">
  <span class="spinner"></span> Reading Austin listings…
</div>

<div id="picks" class="picks"></div>

<template id="card-tpl">
  <article class="card">
    <div class="rank"></div>
    <div class="card-body">
      <h2 class="artist"></h2>
      <p class="when"></p>
      <p class="why"></p>
      <div class="badges"></div>
      <div class="listen"></div>
      <div class="actions">
        <button data-kind="new_to_me" class="chip">Didn't know this</button>
        <button data-kind="save" class="chip">Save</button>
        <button data-kind="not_for_me" class="chip subtle">Not for me</button>
      </div>
    </div>
  </article>
</template>

<p id="meterline" class="meterline"></p>

<script>
const statusEl = document.getElementById('status');
const picksEl  = document.getElementById('picks');
const meterEl  = document.getElementById('meterline');

const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun',
                'Jul','Aug','Sep','Oct','Nov','Dec'];

function prettyDate(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  if (!m) return iso || '';
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  if (isNaN(d)) return iso;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = Math.round((d - today) / 86400000);
  const label = `${DAYS[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}`;
  if (days === 0) return label + ' · tonight';
  if (days === 1) return label + ' · tomorrow';
  if (days > 1 && days < 14) return `${label} · in ${days} days`;
  return label;
}

function badge(text, cls) {
  const b = document.createElement('span');
  b.className = 'badge ' + cls;
  b.textContent = text;
  return b;
}

async function sendEvent(kind, artist, btn) {
  btn.classList.add('done');
  btn.disabled = true;
  await fetch('/api/event', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({kind, artist})
  });
}

function showEmpty(message) {
  statusEl.style.display = 'none';
  picksEl.innerHTML = `
    <div class="empty">
      <h3>Nothing to go on yet</h3>
      <p>${message}</p>
      <a class="btn" href="/log">Add my shows</a>
    </div>`;
}

function render(data) {
  stopStages();
  picksEl.innerHTML = '';
  if (data.error) {
    if (/log/i.test(data.error)) {
      showEmpty('Encore needs a few concerts you&rsquo;ve been to before it can '
                + 'pick shows for you.');
    } else {
      statusEl.innerHTML = '<b>Could not load picks.</b> ' + data.error;
      statusEl.className = 'status error';
    }
    return;
  }
  statusEl.className = 'status';
  statusEl.style.display = 'none';

  data.picks.forEach(p => {
    const node = document.getElementById('card-tpl').content.cloneNode(true);
    node.querySelector('.rank').textContent = p.rank;
    node.querySelector('.artist').textContent = p.artist;

    const when = node.querySelector('.when');
    when.textContent = prettyDate(p.date);
    const venue = document.createElement('span');
    venue.className = 'venue';
    venue.textContent = '  ·  ' + (p.venue || 'venue TBA')
      + (p.support ? '  ·  with ' + p.support : '');
    when.appendChild(venue);

    node.querySelector('.why').textContent = p.why;

    const badges = node.querySelector('.badges');
    // An Austin hometown is the local-discovery signal and worth surfacing.
    // Anywhere else just reads like a second venue, so it is left out.
    const home = (p.research && p.research.hometown) || '';
    if (/austin/i.test(home)) badges.appendChild(badge('Austin band', 'local'));
    badges.appendChild(p.verified
      ? badge('details verified', 'ok')
      : badge('partly unverified', 'warn'));
    badges.appendChild(badge(p.confidence + ' confidence', 'muted'));

    const listen = node.querySelector('.listen');
    const links = (p.research && p.research.listen) || {};
    const LABELS = {spotify: 'Spotify', apple: 'Apple Music', bandcamp: 'Bandcamp'};
    Object.keys(LABELS).forEach(k => {
      if (!links[k]) return;
      const a = document.createElement('a');
      a.className = 'listen-link ' + k;
      a.href = links[k];
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = LABELS[k];
      listen.appendChild(a);
    });
    if (p.also_playing) {
      const more = document.createElement('span');
      more.className = 'alsoplaying';
      more.textContent = `also playing ${p.also_playing} other date`
        + (p.also_playing > 1 ? 's' : '');
      listen.appendChild(more);
    }

    node.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => sendEvent(btn.dataset.kind, p.artist, btn));
    });
    picksEl.appendChild(node);
  });

  if (!data.picks.length) {
    showEmpty('No upcoming shows matched your taste this time.');
    return;
  }

  const m = data.meter || {};
  meterEl.textContent =
    `${data.considered} shows considered · ${data.seconds}s · ` +
    `$${(data.cost || 0).toFixed(4)} · ` +
    `${m.calls || 0} model calls, ${m.cache_hits || 0} cache hits` +
    (data.from_cache ? ' · served from cache' : '');
}

// A first run reads every Austin listing against a new taste profile and
// takes around a minute. Saying what is happening, and roughly how long it
// takes, is the difference between waiting and giving up.
const STAGES = [
  [0,  'Reading every Austin listing…'],
  [8,  'Working out what you&rsquo;re into…'],
  [18, 'Scoring ~460 upcoming shows against your taste…'],
  [34, 'Researching the artists that made the shortlist…'],
  [48, 'Fact-checking the picks…'],
  [62, 'Almost there — first run takes about a minute.'],
];
let stageTimer = null;

function startStages() {
  const began = Date.now();
  const tick = () => {
    const secs = (Date.now() - began) / 1000;
    let label = STAGES[0][1];
    for (const [at, text] of STAGES) if (secs >= at) label = text;
    statusEl.innerHTML = `<span class="spinner"></span> ${label}`;
  };
  tick();
  stageTimer = setInterval(tick, 1000);
}

function stopStages() {
  if (stageTimer) { clearInterval(stageTimer); stageTimer = null; }
}

async function load(force) {
  statusEl.style.display = '';
  statusEl.className = 'status';
  picksEl.innerHTML = '';
  meterEl.textContent = '';
  startStages();
  try {
    const res = await fetch('/api/picks' + (force ? '?force=1' : ''));
    render(await res.json());
  } catch (err) {
    statusEl.className = 'status error';
    statusEl.innerHTML = '<b>Could not load picks.</b> '
      + 'The connection dropped — try reloading.';
  } finally {
    stopStages();
  }
}

document.getElementById('refresh').addEventListener('click', () => load(true));
load(false);
</script>
{% endblock %}
