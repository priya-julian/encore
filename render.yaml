services:
  - type: web
    name: encore
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python scripts/warm_cache.py"
    # A cold sweep can take ~60s, so the request timeout has to clear that.
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --timeout 180 --workers 1"
    envVars:
      - key: PORTKEY_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.6"
